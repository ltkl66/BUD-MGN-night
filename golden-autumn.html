    const name = enc.encode(e.name);
    const data = e.data;
    const crc = xlsxCrc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x5D27, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x5D27, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdStart = parts.reduce((s, p) => s + p.length, 0);
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, cdStart, true); eocd.setUint16(20, 0, true);
  const out = [];
  parts.forEach(p => out.push(p)); central.forEach(p => out.push(p)); out.push(new Uint8Array(eocd.buffer));
  const total = out.reduce((s, p) => s + p.length, 0);
  const res = new Uint8Array(total);
  let o = 0;
  out.forEach(p => { res.set(p, o); o += p.length; });
  return res;
}
function xlsxColName(i) {
  let s = ''; i += 1;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
// sheets: [{name, headers, rows}]
function makeXlsx(sheets) {
  const esc = xlsxEscapeXml;
  const enc = new TextEncoder();
  const entries = [], typeOv = [], rels = [];
  sheets.forEach((sh, si) => {
    const n = si + 1;
    let sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    sheet += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    sheet += '<row r="1">';
    sh.headers.forEach((h, i) => {
      sheet += '<c r="' + xlsxColName(i) + '1" s="1" t="inlineStr"><is><t xml:space="preserve">' + esc(h) + '</t></is></c>';
    });
    sheet += '</row>';
    let r = 2;
    sh.rows.forEach(row => {
      sheet += '<row r="' + r + '">';
      for (let i = 0; i < sh.headers.length; i++) {
        const v = row[i];
        if (v === null || v === undefined || v === '') continue;
        const c = xlsxColName(i) + r;
        if (typeof v === 'number' && isFinite(v)) {
          sheet += '<c r="' + c + '"><v>' + v + '</v></c>';
        } else {
          sheet += '<c r="' + c + '" t="inlineStr"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';
        }
      }
      sheet += '</row>';
      r++;
    });
    sheet += '</sheetData></worksheet>';
    entries.push({ name: 'xl/worksheets/sheet' + n + '.xml', data: enc.encode(sheet) });
    typeOv.push('<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    rels.push('<Relationship Id="rId' + n + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + n + '.xml"/>');
  });

  const stylesRid = 'rId' + (sheets.length + 1);
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    typeOv.join('') +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets>' + sheets.map((sh, si) =>
      '<sheet name="' + esc(sh.name) + '" sheetId="' + (si + 1) + '" r:id="rId' + (si + 1) + '"/>').join('') +
    '</sheets></workbook>';

  const wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    rels.join('') +
    '<Relationship Id="' + stylesRid + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="2">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  return xlsxZip([
    { name: '[Content_Types].xml', data: enc.encode(contentTypes) },
    { name: '_rels/.rels', data: enc.encode(rootRels) },
    { name: 'xl/workbook.xml', data: enc.encode(workbook) },
    { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels) },
    { name: 'xl/styles.xml', data: enc.encode(styles) }
  ].concat(entries));
}
/* ============ XLSX 生成器结束 ============ */

const fmt = n => Number(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 2026-09-14 -> 9/14
const md = s => { const p = String(s).split('-'); return Number(p[1]) + '/' + Number(p[2]); };

function render(){
  document.getElementById('meta').textContent =
    '活动期 ' + md(DATA.start) + ' 起累计 · 数据更新至 ' + md(DATA.through);

  const totalStores = DATA.m3.reduce((a, m) => a + m.stores, 0);
  document.getElementById('overview').innerHTML = [
    ['参与销售经理', DATA.m3.length, '人'],
    ['有扫码门店', totalStores, '家'],
    ['扫码盖合计', DATA.totalCaps, '盖']
  ].map(([k, v, u], i) =>
    '<div class="ov' + (i === 2 ? ' hl' : '') + '"><div class="k">' + k + '</div><div class="v">' +
    fmt(v) + '<span class="u">' + u + '</span></div></div>'
  ).join('');

  const maxM3 = Math.max.apply(null, DATA.m3.map(m => m.caps).concat([1]));
  document.getElementById('race').innerHTML =
    '<h2>累计扫码盖数量</h2>' +
    DATA.m3.map(m =>
      '<div class="rl"><div class="top"><span class="nm">' + esc(m.name) +
      '</span><span class="vl">' + fmt(m.caps) + '<i>盖</i></span></div>' +
      '<div class="track"><div class="fill" style="width:' + Math.round(m.caps / maxM3 * 100) + '%"></div></div></div>'
    ).join('');

  // —— 全场 Top 5：所有门店拉通排名，三块看板中同步高亮这 5 家 ——
  const TOP_N = 5;
  const allStores = [];
  DATA.m3.forEach((m, mi) => m.list.forEach((x, i) =>
    allStores.push({ mi: mi, i: i, store: x.store, caps: x.caps, m3: m.name })));
  allStores.sort((a, b) => b.caps - a.caps || a.store.localeCompare(b.store));
  const crown = allStores.slice(0, TOP_N);
  const topKeys = {};
  crown.forEach(x => { topKeys[x.mi + ':' + x.i] = true; });

  document.getElementById('crown').innerHTML =
    '<h2>全场 TOP 5 门店<span>' + allStores.length + ' 家拉通排名 · 前 5 名在下方各经理榜单标注「本榜单Top5」</span></h2>' +
    '<ol>' + crown.map((x, k) =>
      '<li><span class="rk">' + (k + 1) + '</span>' +
      '<span class="cs" title="' + esc(x.store) + '">' + esc(x.store) + '</span>' +
      '<span class="who">' + esc(x.m3) + '</span>' +
      '<span class="cp">' + fmt(x.caps) + '<i>盖</i></span></li>'
    ).join('') + '</ol>';

  document.getElementById('boards').innerHTML = DATA.m3.map((m, mi) => {
    const max = Math.max.apply(null, m.list.map(x => x.caps).concat([1]));
    const rows = m.list.map((x, i) => {
      const isGlobal = !!topKeys[mi + ':' + i];   // 本榜单（全局拉通）TOP5
      const isM3Top = i < TOP_N;                  // 该销售经理自己的 TOP5（list 已按盖数降序）
      // 两级高亮互斥：本榜单 TOP5 视觉优先级更高，命中时不再叠加经理级样式
      const cls = isGlobal ? 'top5' : (isM3Top ? 'm3top5' : '');
      const tag = isGlobal ? '<span class="tag">本榜单Top5</span>'
                : (isM3Top ? '<span class="tag">TOP5</span>' : '');
      return '<li class="' + cls + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<span class="store" title="' + esc(x.store) + '">' + esc(x.store) + '</span>' +
        tag +
        '<span class="caps">' + fmt(x.caps) + '<i>盖</i></span>' +
        '<span class="mini" style="width:' + Math.max(2, Math.round(x.caps / max * 100)) + '%"></span>' +
      '</li>';
    }).join('');
    const rest = Math.max(0, m.list.length - 10);
    return '<section class="board">' +
      '<header><div class="m3name">' + esc(m.name) + '<span class="city">' + esc(m.city) +
      '</span></div><div class="m3stat"><b>' + m.stores + '</b>家门店 · <b>' + fmt(m.caps) + '</b>盖</div></header>' +
      '<ol class="rank" id="rank-' + mi + '">' + rows + '</ol>' +
      (rest ? '<button class="more" data-idx="' + mi + '" data-n="' + rest + '" data-open="0">展开其余 ' + rest + ' 家 ▾</button>' : '') +
      '</section>';
  }).join('');

  document.querySelectorAll('ol.rank').forEach(ol => {
    Array.prototype.forEach.call(ol.children, (li, i) => { if (i >= 10) li.classList.add('hidden'); });
  });

  document.querySelectorAll('.more').forEach(btn => {
    btn.addEventListener('click', () => {
      const ol = document.getElementById('rank-' + btn.dataset.idx);
      const open = btn.dataset.open === '1';
      Array.prototype.forEach.call(ol.children, (li, i) => { if (i >= 10) li.classList.toggle('hidden', open); });
      btn.dataset.open = open ? '0' : '1';
      btn.textContent = open ? ('展开其余 ' + btn.dataset.n + ' 家 ▾') : '收起 ▴';
    });
  });

  const top = DATA.m3.slice().sort((a, b) => b.caps - a.caps)[0];
  document.getElementById('foot').innerHTML =
    '数据来源：DBOF 扫码明细（CIO 描述含「黑金」，按 M3 归属销售经理）<br>' +
    '统计口径：活动期 ' + DATA.start + ' 起累计扫码盖数量 · 数据更新至 ' + DATA.through + '<br>' +
    '高亮口径：<b>深金</b>=本榜单 TOP5（全部门店拉通前 5）· <b>浅金</b>=各销售经理自身 TOP5<br>' +
    '页面生成：<b>' + DATA.generatedAt + '</b> · 当前领先：<b>' + esc(top.name) + '</b>（' + fmt(top.caps) + ' 盖）';
}

render();

/* ============ 下载榜单 Excel ============ */
function exportRankExcel() {
  const btn = document.getElementById('dlBtn');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '生成中…';

  try {
    // 1) 全场榜单：所有门店拉通排名（同时带上各经理内部名次）
    const all = [];
    DATA.m3.forEach(m => m.list.forEach(x =>
      all.push({ store: x.store, m3: m.name, city: m.city, caps: x.caps })));
    all.sort((a, b) => b.caps - a.caps || a.store.localeCompare(b.store));

    const m3Rank = {};
    DATA.m3.forEach(m => m.list.forEach((x, i) => { m3Rank[m.name + '|' + x.store] = i + 1; }));

    const sheetRank = {
      name: '全场榜单',
      headers: ['名次', '门店', '销售经理', '城市', '扫码盖数量', '经理内名次', '备注'],
      rows: all.map((x, i) => {
        const rk = m3Rank[x.m3 + '|' + x.store] || '';
        const note = i < 5 ? '本榜单Top5' : (rk && rk <= 5 ? '经理Top5' : '');
        return [i + 1, x.store, x.m3, x.city, x.caps, rk, note];
      })
    };

    // 2) 分经理汇总
    const rows2 = DATA.m3.map(m => [
      m.name, m.city, m.stores, m.caps,
      DATA.totalCaps ? (Math.round(m.caps / DATA.totalCaps * 1000) / 10) + '%' : '0%'
    ]);
    rows2.push(['合计', '', DATA.m3.reduce((a, m) => a + m.stores, 0), DATA.totalCaps, '100%']);
    const sheetM3 = {
      name: '分经理汇总',
      headers: ['销售经理', '城市', '有扫码门店数', '扫码盖数量', '盖数占比'],
      rows: rows2
    };

    // 3) 口径说明
    const sheetNote = {
      name: '统计口径',
      headers: ['项目', '说明'],
      rows: [
        ['榜单名称', '金秋卖黑金 · 多卖多吸金'],
        ['数据来源', 'DBOF 扫码明细'],
        ['筛选条件', 'CIO 描述含「黑金」 且 M3 为 ' + DATA.m3.map(m => m.name).join(' / ')],
        ['累计起点', DATA.start + '（活动首日）'],
        ['数据截至', DATA.through],
        ['统计指标', '扫码盖数量（按门店累计求和）'],
        ['本榜单TOP5 口径', '全部门店拉通排名前 5 名（备注「本榜单Top5」）'],
        ['经理TOP5 口径', '各销售经理自身榜单排名前 5 名（备注「经理Top5」）'],
        ['页面生成时间', DATA.generatedAt]
      ]
    };

    const bytes = makeXlsx([sheetRank, sheetM3, sheetNote]);
    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '金秋卖黑金榜单_' + String(DATA.through).replace(/-/g, '') + '.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

document.getElementById('dlBtn').addEventListener('click', exportRankExcel);
</script>
